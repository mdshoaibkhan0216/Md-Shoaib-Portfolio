<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md Shoaib Khan | Portfolio</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #070d18;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            padding: 40px;
        }

        h1 {
            color: #6ec6ff;
        }

        a {
            color: #6ec6ff;
        }
    </style>
</head>

<body>

<div class="box" id="message">
    <h1>Opening Portfolio...</h1>
</div>

<script>

const USED_KEY = "shoaib_portfolio_viewed";

if (localStorage.getItem(USED_KEY)) {

    document.getElementById("message").innerHTML = `
        <h1>Link Expired</h1>
        <p>This portfolio link has already been viewed on this device.</p>
    `;

} else {

    localStorage.setItem(USED_KEY, "true");

    window.location.href =
        "https://mdshoaibkhan0216.github.io/Md-Shoaib-Portfolio/";
}

</script>

</body>
</html>
